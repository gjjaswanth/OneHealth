<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 One Health Assignments</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 4px 12px rgba(0,0,0,.05);
      --green: #118a3a;
      --red: #c0262d;
      --button: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }
    header {
      text-align: center;
      padding: 6px 0 20px;
    }
    h1 {
      font-size: clamp(30px, 3.8vw, 52px);
      line-height: 1.1;
      margin: 8px 0 6px;
      font-weight: 800;
      color: #000;
    }
    .subtitle {
      margin: 0 auto;
      max-width: 880px;
      color: var(--muted);
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 18px 0 24px;
    }
    button, .link-btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease, background .2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:active, .link-btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--button); color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .meta {
      text-align: center;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    form {
      display: grid;
      gap: 18px;
    }
    .question-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid #f0f0f0;
      padding: 18px 18px 14px;
    }
    .qtop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }
    .qtitle {
      font-size: 18px;
      line-height: 1.55;
      margin: 0;
      font-weight: 500;
    }
    .week-badge {
      flex: 0 0 auto;
      font-size: 12px;
      background: #eef2ff;
      color: #3730a3;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .options {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }
    label.opt {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 16px;
      line-height: 1.45;
      cursor: pointer;
      user-select: none;
    }
    label.opt input {
      margin-top: 4px;
      transform: scale(1.05);
      flex: 0 0 auto;
    }
    .text-answer {
      width: min(420px, 100%);
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    .text-answer:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 3px rgba(17,24,39,.08);
    }
    .result {
      margin-top: 12px;
      font-weight: 700;
      min-height: 24px;
      font-size: 15px;
    }
    .correct { color: var(--green); }
    .wrong { color: var(--red); }
    .note {
      display: none;
      margin-top: 8px;
      font-size: 14px;
      color: #374151;
      background: #f9fafb;
      border: 1px dashed #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .scorebox {
      margin-top: 20px;
      padding: 16px 18px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }
    .scoredetails {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }
    .sticky-submit {
      position: sticky;
      bottom: 14px;
      z-index: 5;
      display: flex;
      justify-content: center;
      pointer-events: none;
      margin-top: 10px;
    }
    .sticky-submit button {
      pointer-events: auto;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }
    @media (max-width: 700px) {
      .qtitle { font-size: 17px; }
      label.opt { font-size: 15px; }
      .question-card { padding: 16px 14px 12px; }
    }
  </style>
</head>

ors contributing to disease emergence?","type":"single","options":["Climate change","Urbanization","Displacement","All of the above"],"answer":"All of the above"},{"week":3,"q":"The method through which several rounds of enquiries for expert opinion is carried out mostly through anonymous forms/questionnaires is called?","type":"single","options":["Opinion poll","Risk matrix","Analytic hierarchy","Delphi"],"answer":"Delphi"},{"week":3,"q":"Human behaviour comes under which of the players in the disease emergence?","type":"single","options":["Host","Agent","Environment","All of the above"],"answer":"Host"},{"week":3,"q":"Which among the following is a component of risk assessment?","type":"single","options":["Risk identification","Risk evaluation","Risk analysis","All of the above"],"answer":"All of the above"},{"week":3,"q":"Which method for risk assessment is used when there is a lack of necessary data?","type":"single","options":["Expert Consultation method","Delphi method","Analytic hierarchy process","Risk matrix method"],"answer":"Analytic hierarchy process"},{"week":3,"q":"Diseases which are associated with intent to harm, including mass bioterrorism is called?","type":"single","options":["Re-emerging infectious diseases","Deliberately emerging infectious diseases","De-emerging infectious diseases","None of the above"],"answer":"Deliberately emerging infectious diseases"},{"week":4,"q":"Covid-19 pandemic outbreak began in which year in INDIA?","type":"single","options":["2019","2020","2021","2022"],"answer":"2020"},{"week":4,"q":"Virus transmitted from a wild animal to mosquito which then transmits it to a human host. This is an example of which kind of zoonotic spillover?","type":"single","options":["Direct Spillover","Intermediate by vertebrate","Intermediate by invertebrate","Environment Spillover"],"answer":"Intermediate by invertebrate"},{"week":4,"q":"What is \"pathogen pressure\" as defined in the slide?","type":"single","options":["The resistance of a e of the above"],"answer":"The Integrated Health Information Platform (IHIP) is a recent development in the already existing Integrated Disease Surveillance Programme (IDSP)."},{"week":4,"q":"What is one major challenge in integrating public health surveillance data in India?","type":"single","options":["Lack of international funding","Working in silos without a mechanism for data integration","Overuse of digital tools","Too many private hospitals"],"answer":"Working in silos without a mechanism for data integration"},{"week":4,"q":"Which of the following can be considered as a gap in the current health system approaches?","type":"single","options":["Vacancies in District Public Health Labs","Delays in lab confirmation on outbreaks","Lack of advance technology being used to detect outbreaks","All of the above"],"answer":"All of the above"},{"week":5,"q":"Which of the following parasites causes zoonotic malaria infections in parts of south-east Asia?","type":"single","options":["Plasmodium berghei","Plasmodium ovale","Plasmodium malariae","Plasmodium knowlesi"],"answer":"Plasmodium knowlesi"},{"week":5,"q":"According to the slide, What percentage of infectious diseases are estimated to be vector-borne?","type":"single","options":["Approximately 17%","Around 25%","Approximately 50%","Around 75%"],"answer":"Approximately 17%"},{"week":5,"q":"What is the causative agent of Japanese encephalitis?","type":"single","options":["Influenza virus","Japanese encephalitis virus (JEV)","Dengue virus","Herpes simplex virus"],"answer":"Japanese encephalitis virus (JEV)"},{"week":5,"q":"What does MRSA stand for?","type":"single","options":["Methicillin-Resistant Strep Infection","Methicillin-Resistant Staphylococcus aureus","Multi-Resistant Staphylococcus Ailment","Methicillin-Resistant Streptococcus Anginous"],"answer":"Methicillin-Resistant Staphylococcus aureus"},{"week":5,"q":"Scrub typus is caused by which bacteria?","type":"single","options":["Rickettsia rickettsia","Orientia rds with long-term intervention goals"},{"week":7,"q":"OHHLEP stands for?","type":"single","options":["One Health Huge-Level Expert Panel","One Health High-Level Expert Panel","One Health Healthy-Level Expert Panel","One Health Human-Level Expert Panel"],"answer":"One Health High-Level Expert Panel"},{"week":7,"q":"Why is strengthening national and international emergency response important under One Health?","type":"single","options":["To promote economic growth","To reduce public spending","To prevent and control disease outbreaks","To limit population movement"],"answer":"To prevent and control disease outbreaks"},{"week":7,"q":"How does the 'One Health' approach benefit future health systems?","type":"single","options":["It eliminates the need for human medicine","It focuses only on economic development","It helps prevent pandemics and builds more resilient and equitable systems","It focuses solely on urban healthcare infrastructure"],"answer":"It helps prevent pandemics and builds more resilient and equitable systems"},{"week":7,"q":"Which interface is emphasized for preventive action in the One Health strategy?","type":"single","options":["Human-technology interface","Human-animal-ecosystem interface","Animal-laboratory interface","Hospital-community interface"],"answer":"Human-animal-ecosystem interface"},{"week":8,"q":"What are the reasons for ‘One Health’ attention in India?","type":"single","options":["21.54% of area is forested of the country","Increasing consumption of antibiotics","Huge wet market sector and industrial animal trade","All of the above"],"answer":"All of the above"},{"week":8,"q":"A zoonotic infection/disease is ____.","type":"single","options":["an infection or disease that can be transmitted from an insect to another insect","an infection or disease that can be transmitted from an animal to an insect","an infection or disease that can be transmitted from an animal to another animal","an infection or disease that can be transmitted from function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(s) {
  return String(s || "").trim().toLowerCase().replace(/\s+/g, " ").replace(/[\u2019']/g, "'");
}

const questions = shuffle(quizData);
const form = document.getElementById("quizForm");
document.getElementById("metaLine").textContent = `${questions.length} questions loaded. Questions and options are shuffled on each refresh.`;

function render() {
  form.innerHTML = "";
  questions.forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    const weekLabel = item.week ? `Week ${item.week}` : "Question";
    let inner = `
      <div class="qtop">
        <p class="qtitle">${idx + 1}) ${item.q}</p>
        <div class="week-badge">${weekLabel}</div>
      </div>
    `;

    if (item.type === "multi") {
      const opts = shuffle(item.options || []);
      inner += `<div class="options">`;
      opts.forEach((opt) => {
        inner += `<label class="opt"><input type="checkbox" name="q${idx}" value="${escapeHtml(opt)}"> <span>${escapeHtml(opt)}</span></label>`;
      });
      inner += `</div>`;
    } else if (item.type === "text") {
      inner += `<input class="text-answer" type="text" name="q${idx}" placeholder="Type your answer here" autocomplete="off" />`;
    } else {
      const opts = shuffle(item.options || []);
      inner += `<div class="options">`;
      opts.forEach((opt) => {
        inner += `<label class="opt"><input type="radio" name="q${idx}" value="${escapeHtml(opt)}"> <span>${escapeHtml(opt)}</span></label>`;
      });
      inner += `</div>`;
    }

    inner += `
      <div class="result" id="r${idx}"></div>
      <div class="note" id="n${idx}"></div>
    `;
    card.innerHTML = inner;
    form.appendChild(card);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function compareMulti(selected, expected) {
  const a = [...new Set(selected.map(normalize))].sort();
  const b = [...new Set(expected.map(normalize))].sort();
  if (a.length !== b.length) return false;
  return a.every((v, i) => v === b[i]);
}

function submitQuiz() {
  let score = 0;
  let correct = 0, wrong = 0, blank = 0;

  questions.forEach((item, idx) => {
    const res = document.getElementById(`r${idx}`);
    const note = document.getElementById(`n${idx}`);

    if (item.type === "multi") {
      const checked = [...document.querySelectorAll(`input[name="q${idx}"]:checked`)].map(el => el.value);
      const ok = compareMulti(checked, item.answers || []);
      if (checked.length === 0) {
        blank++;
        res.textContent = `❌ Not Answered | Correct: ${item.answers.join(", ")}`;
        res.className = "result wrong";
      } else if (ok) {
        score++; correct++;
        res.textContent = "✅ Correct";
        res.className = "result correct";
      } else {
        wrong++;
        res.textContent = `❌ Wrong | Correct: ${item.answers.join(", ")}`;
        res.className = "result wrong";
      }
      note.style.display = "block";
      note.textContent = `Select all correct options.`;
      return;
    }

    if (item.type === "text") {
      const inp = document.querySelector(`input[name="q${idx}"]`);
      const val = normalize(inp ? inp.value : "");
      const ans = normalize(item.answer);
      if (!val) {
        blank++;
        res.textContent = `❌ Not Answered | Correct: ${item.answer}`;
        res.className = "result wrong";
      } else if (val === ans) {
        score++; correct++;
        res.textContent = "✅ Correct";
        res.className = "result correct";
      } else {
        wrong++;
        res.textContent = `❌ Wrong | Correct: ${item.answer}`;
        res.className = "result wrong";
      }
      note.style.display = "block";
      note.textContent = `Type answer: ${item.answer}`;
      return;
    }

    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    if (!selected) {
      blank++;
      res.textContent = `❌ Not Answered | Correct: ${item.answer}`;
      res.className = "result wrong";
    } else if (normalize(selected.value) === normalize(item.answer)) {
      score++; correct++;
      res.textContent = "✅ Correct";
      res.className = "result correct";
    } else {
      wrong++;
      res.textContent = `❌ Wrong | Correct: ${item.answer}`;
      res.className = "result wrong";
    }
    note.style.display = "none";
  });

  const total = questions.length;
  document.getElementById("scoreBox").innerHTML =
    `Final Score: ${score} / ${total} <span class="scoredetails">Correct: ${correct} &nbsp;|&nbsp; Wrong: ${wrong} &nbsp;|&nbsp; Not Answered: ${blank}</span>`;
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function resetQuiz() {
  render();
  document.getElementById("scoreBox").textContent = "Submit the quiz to see your score.";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

render();
</script>
