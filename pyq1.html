<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Health Question Bank</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="topbar">

<h2 id="pageTitle">
🩺 One Health Question Bank
</h2>

<h3 id="modeTitle">
Loading...
</h3>

<p id="counter"></p>

<div class="progress">

<div id="progressBar" class="progress-fill"></div>

</div>

</div>

<div class="quiz-container">

<!-- Week Navigation (Practice Mode Only) -->

<div id="weekNavigation" class="week-nav">

<button id="prevWeek">
⬅ Previous Week
</button>

<h2 id="weekTitle">
Week 1
</h2>

<button id="nextWeek">
Next Week ➜
</button>

</div>

<!-- Question Navigation (Mock Mode Only) -->

<div id="mockNavigation" class="week-nav" style="display:none;">

<button id="prevQuestion">
⬅ Previous
</button>

<button id="nextQuestion">
Next ➜
</button>

</div>

<form id="quizForm">

<!-- Questions generated by script.js -->

</form>

<button
id="finishBtn"
class="submit-btn"
style="display:none;">

Finish Mock Test

</button>

<div id="score" class="score">

</div>

</div>

<script src="questions.js"></script>

<script src="script.js"></script>

</body>

</html>
